<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE HOLLOWDEEP — vertical slice</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000;
        font-family: Georgia, 'Times New Roman', serif; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #topbar { position: absolute; top: 0; left: 0; right: 0; display: flex;
        justify-content: space-between; padding: 12px 16px;
        color: #d8c690; text-shadow: 0 0 8px #000; font-size: 14px; letter-spacing: 2px; }
      #hpbar-wrap { width: 220px; height: 14px; border: 1px solid #6b5320; background: #1a0f0a; }
      #hpbar { height: 100%; width: 100%; background: linear-gradient(90deg, #a31212, #e04040); transition: width .3s; }
      #minimap { position: absolute; right: 16px; bottom: 16px; border: 1px solid #6b5320;
        background: rgba(0,0,0,.75); }
      #log { position: absolute; left: 16px; bottom: 16px; width: 340px; max-height: 180px;
        overflow: hidden; color: #cdb87a; font-size: 13px; line-height: 1.5;
        text-shadow: 0 1px 2px #000; }
      #log div { margin-top: 4px; opacity: .95; }
      #log div.faded { opacity: .45; }
      #center-msg { position: absolute; top: 38%; left: 0; right: 0; text-align: center;
        color: #e8d9a0; font-size: 22px; letter-spacing: 3px; text-shadow: 0 0 12px #000;
        opacity: 0; transition: opacity .5s; }
      #title { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: radial-gradient(ellipse at center, #0a0605 0%, #000 75%);
        color: #d8c690; cursor: pointer; }
      #title h1 { font-size: 52px; letter-spacing: 12px; font-weight: normal; margin-bottom: 8px; }
      #title p { font-size: 15px; letter-spacing: 3px; opacity: .7; margin-bottom: 32px; }
      #title .enter { font-size: 18px; letter-spacing: 4px; border: 1px solid #6b5320;
        padding: 12px 36px; animation: pulse 2s infinite; }
      @keyframes pulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
      #help { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
        color: #8a7648; font-size: 12px; letter-spacing: 2px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="topbar">
        <div>THE HOLLOWDEEP</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span>HP</span><div id="hpbar-wrap"><div id="hpbar"></div></div>
        </div>
      </div>
      <canvas id="minimap" width="150" height="150"></canvas>
      <div id="log"></div>
      <div id="center-msg"></div>
      <div id="help">WASD / ARROWS — MOVE &nbsp;·&nbsp; E — SEARCH &nbsp;·&nbsp; SPACE — ATTACK</div>
    </div>
    <div id="title">
      <h1>HOLLOWDEEP</h1>
      <p>THE LABYRINTH REARRANGES ITSELF NIGHTLY</p>
      <div class="enter">DESCEND</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
